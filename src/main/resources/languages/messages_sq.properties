txt.AboutOurRentaCarSystem=Rreth Sistemit Tonë të Marrjes me Qira të Veturave
txt.welcomeRentACar=Mirë se vini në platformën tonë të marrjes me qira të veturave. Sistemi ynë është dizajnuar për t'ju ndihmuar të rezervoni vetura lehtësisht sipas preferencave dhe nevojave tuaja.
txt.ReservationOptions=Opsionet e Rezervimit:
txt.PersonalUse=Kontrata dhe Përdorimi Personal:
txt.EachReservation=Çdo rezervim gjeneron një kontratë për përdorimin tuaj personal. Kjo kontratë përfshin detajet e veturës, periudhën e qirasë, informacionin për pagesën dhe kushtet e përdorimit.
txt.RentalRules=Ju lutemi respektoni rregullat e qirasë. Mund të aplikohen penalizime në rast të shkeljes së rregullave ose dëmtimit të veturës. Të gjitha penalizimet do të jenë të dukshme në historinë tuaj të rezervimeve.
txt.AccountSecurity=Për sigurinë e llogarisë suaj, mund ta ndryshoni fjalëkalimin në çdo kohë nga cilësimet e profilit.
txt.SwitchLanguages=Mund të ndryshoni ndërmjet gjuhëve të ndryshme për të përdorur aplikacionin në gjuhën që preferoni.
txt.ThankYouService=Faleminderit që përdorni shërbimin tonë. Ju dëshirojmë një udhëtim të sigurt dhe të këndshëm!
txt.BrowseApp=Mund të shfletoni veturat tona në dispozicion dhe të bëni rezervime direkt përmes aplikacionit. Mjafton të zgjidhni veturën që dëshironi, të caktoni periudhën e rezervimit dhe të konfirmoni prenotimin.
txt.PenaltiesRules=Penalizime dhe Rregulla:
txt.PasswordManagement=Menaxhimi i Fjalëkalimit:
txt.LanguageOptions=Opsionet e Gjuhës:
txt.staffPanelTitle=Paneli i Stafit - Sistemi i Marrjes me Qira të Veturave
txt.staffWelcomeText=Mirë se vini në ndërfaqen për menaxhimin e stafit. Kjo pjesë është krijuar për t'ju ndihmuar të menaxhoni marrjen me qira të veturave, detajet e klientëve, kontratat, penalizimet dhe mirëmbajtjet në mënyrë efektive.
txt.staffContractManagement=Menaxhimi i Kontratave:
txt.staffContractManagementText=Si anëtar i stafit, mund të shtoni kontrata të reja për çfarëdo klienti. Specifikoni detajet e veturës, periudhën e qirasë dhe çmimin total për të përfunduar marrëveshjen.
txt.staffPenaltyManagement=Menaxhimi i Penalizimeve:
txt.staffPenaltyManagementText=Nëse një klient shkel kushtet e qirasë ose shkakton dëmtime, mund të aplikoni penalizime. Ato regjistrohen dhe lidhen me llogarinë e klientit për transparencë të plotë.
txt.staffVehicleMaintenance=Mirëmbajtja e Veturave:
txt.staffVehicleMaintenanceText=Siguroni që të gjitha veturat të jenë në gjendje të shkëlqyer. Mund të shtoni të dhëna për mirëmbajtje dhe të gjurmoni historikun e shërbimit për çdo veturë para se të jepet me qira.
txt.staffClientMonitoring=Monitorimi i Klientëve:
txt.staffClientMonitoringText=Shikoni të gjitha kontratat, pagesat, penalizimet dhe rezervimet për çdo klient. Kjo ofron një pasqyrë të plotë për vendimmarrje dhe shërbim ndaj klientëve.
txt.staffLanguageSettings=Gjuha dhe Cilësimet:
txt.staffThankYou=Faleminderit për përkushtimin tuaj në sigurimin e një përvoje të qetë, të besueshme dhe profesionale për marrjen me qira të veturave!
txt.staffLanguageSettingsText=Ndryshoni gjuhën e aplikacionit, fjalëkalimin tuaj dhe konfiguroni cilësimet direkt nga shiriti i menysë.
