txt.welcomeRentACar=Welcome to our Rent a Car platform. Our system is designed to help you easily reserve vehicles based on your preferences and needs.
txt.ReservationOptions=Reservation Options:
txt.PersonalUse=Contracts and Personal Use:
txt.EachReservation=Each reservation generates a contract for your personal use. This contract includes the car details, rental period, payment information, and terms of use.
txt.RentalRules=Please respect the rental rules. Penalties may be applied in case of rule violations or car damages. All penalties will be visible in your reservation history.
txt.AccountSecurity=For your account security, you can change your password at any time from your profile settings.
txt.SwitchLanguages=You can switch between different languages to use the application in the language you prefer.
txt.ThankYouService=Thank you for using our service. We wish you a safe and pleasant journey!
txt.PenaltiesRules=Penalties and Rules:
txt.PasswordManagement=Password Management:
txt.LanguageOptions=Language Options:
txt.BrowseApp=You can browse our available vehicles and make reservations directly through the app. Simply select the car you want, choose the reservation period, and confirm your booking.
txt.staffPanelTitle=Staff Panel - Rent a Car System
txt.staffWelcomeText=Welcome to the staff management interface. This section is designed to help you manage vehicle rentals, client details, contracts, penalties, and maintenance effectively.
txt.staffContractManagement=Contract Management:
txt.staffContractManagementText=As a staff member, you can add new rental contracts for any client. Specify vehicle details, rental period, and total price to complete the agreement.
txt.staffPenaltyManagement=Penalty Management:
txt.staffPenaltyManagementText=If a client violates rental terms or causes damage to vehicles, you can apply penalties. These are recorded and associated with the client's account for full transparency.
txt.staffVehicleMaintenance=Vehicle Maintenance:
txt.staffVehicleMaintenanceText=Ensure all vehicles are in top condition. You can add maintenance records and track service history for each car before assigning it for a new rental.
txt.staffClientMonitoring=Client Monitoring:
txt.staffClientMonitoringText=View all contracts, payments, penalties, and reservations of every client. This provides a complete overview to support decision making and customer service.
txt.staffLanguageSettings=Language and Settings:
txt.staffThankYou=Thank you for your dedication in ensuring a smooth, reliable, and professional car rental experience!
txt.staffLanguageSettingsText=Switch the app language, change your password, and configure settings directly from the menu bar.
